<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloraScan AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .treatment-step { border-left: 4px solid #22c55e; padding-left: 1rem; margin-bottom: 1.5rem; }
    </style>
</head>
<body class="min-h-screen py-10 px-4">
    <div class="max-w-4xl mx-auto">
        
        <div class="text-center mb-12">
            <h1 class="text-5xl font-extrabold text-slate-900 tracking-tight mb-3">Flora<span class="text-green-600">Scan</span></h1>
            <p class="text-slate-500 text-lg">AI-Powered Disease Detection & Treatment Guide</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <div class="space-y-6">
                <div id="dropZone" class="glass-card rounded-3xl p-8 border-2 border-dashed border-slate-300 hover:border-green-500 transition-all cursor-pointer text-center relative overflow-hidden group">
                    <input type="file" id="imageInput" class="hidden" accept="image/*">
                    <div id="promptText">
                        <div class="w-16 h-16 bg-green-50 rounded-2xl flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform">
                            <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="2" stroke-linecap="round"/></svg>
                        </div>
                        <p class="font-semibold text-slate-700">Upload Leaf Image</p>
                        <p class="text-sm text-slate-400">Drag and drop or click</p>
                    </div>
                    <img id="preview" class="hidden w-full h-64 object-cover rounded-2xl shadow-inner">
                </div>

                <div id="loading" class="hidden text-center p-4 bg-white rounded-2xl shadow-sm animate__animated animate__fadeIn">
                    <div class="flex items-center justify-center space-x-3">
                        <div class="w-3 h-3 bg-green-600 rounded-full animate-bounce"></div>
                        <div class="w-3 h-3 bg-green-600 rounded-full animate-bounce [animation-delay:-.3s]"></div>
                        <div class="w-3 h-3 bg-green-600 rounded-full animate-bounce [animation-delay:-.5s]"></div>
                    </div>
                    <p class="text-slate-600 mt-2 font-medium">Running Neural Analysis...</p>
                </div>
            </div>

            <div id="resultContainer" class="hidden space-y-6 animate__animated animate__fadeInRight">
                <div class="glass-card rounded-3xl p-8 shadow-xl">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <span id="statusBadge" class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-2 inline-block"></span>
                            <h2 id="diseaseName" class="text-3xl font-extrabold text-slate-800 lowercase capitalize"></h2>
                        </div>
                        <div class="text-right">
                            <p class="text-xs font-bold text-slate-400 uppercase">Confidence</p>
                            <p id="confValue" class="text-2xl font-black text-green-600"></p>
                        </div>
                    </div>

                    <div class="space-y-6">
                        <div class="treatment-step">
                            <h4 class="text-sm font-bold text-slate-400 uppercase tracking-tighter">Recommended Pesticide</h4>
                            <p id="pestInfo" class="text-slate-700 font-medium"></p>
                        </div>
                        <div class="treatment-step" style="border-color: #3b82f6;">
                            <h4 class="text-sm font-bold text-slate-400 uppercase tracking-tighter">Fertilizer Boost</h4>
                            <p id="fertInfo" class="text-slate-700 font-medium"></p>
                        </div>
                        <div class="treatment-step" style="border-color: #f59e0b;">
                            <h4 class="text-sm font-bold text-slate-400 uppercase tracking-tighter">Directions for Use</h4>
                            <p id="dirInfo" class="text-slate-700 text-sm leading-relaxed"></p>
                        </div>
                    </div>

                    <button onclick="location.reload()" class="w-full mt-8 bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-slate-800 transition-all shadow-lg shadow-slate-200">New Diagnosis</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const dropZone = document.getElementById('dropZone');
        const preview = document.getElementById('preview');
        const promptText = document.getElementById('promptText');
        const resultContainer = document.getElementById('resultContainer');
        const loading = document.getElementById('loading');

        dropZone.onclick = () => imageInput.click();

        imageInput.onchange = e => {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    preview.src = event.target.result;
                    preview.classList.remove('hidden');
                    promptText.classList.add('hidden');
                    analyze(file);
                };
                reader.readAsDataURL(file);
            }
        };

        async function analyze(file) {
            loading.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            
            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch('/predict', { method: 'POST', body: formData });
                const data = await response.json();

                loading.classList.add('hidden');
                resultContainer.classList.remove('hidden');

                // Fill UI
                document.getElementById('diseaseName').innerText = data.disease;
                document.getElementById('confValue').innerText = Math.round(data.confidence * 100) + '%';
                
                const badge = document.getElementById('statusBadge');
                if(data.status === 'healthy') {
                    badge.innerText = "Healthy Plant";
                    badge.className = "px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-2 inline-block bg-green-100 text-green-700";
                } else {
                    badge.innerText = "Disease Detected";
                    badge.className = "px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-2 inline-block bg-red-100 text-red-700";
                }

                document.getElementById('pestInfo').innerText = data.treatment.pesticide;
                document.getElementById('fertInfo').innerText = data.treatment.fertilizer;
                document.getElementById('dirInfo').innerText = data.treatment.directions;

            } catch (err) {
                alert("Error connecting to AI server.");
            }
        }
    </script>
</body>
</html>
